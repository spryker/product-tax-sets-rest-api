resource:
    name: ProductTaxSets
    shortName: product-tax-sets
    description: 'Storefront tax set for abstract products'

    provider: Spryker\Glue\ProductTaxSetsRestApi\Api\Storefront\Provider\ProductTaxSetsStorefrontProvider

    paginationEnabled: false

    operations:
        - type: GetCollection
          uriTemplate: /abstract-products/{abstractProductSku}/product-tax-sets
          description: 'Retrieve tax set of an abstract product'
          uriVariables:
              abstractProductSku:
                  fromClass: AbstractProductsStorefrontResource
          openapiContext:
              responses:
                  200:
                      description: 'Tax set of the abstract product returned.'
                  404:
                      description: 'No tax set exists for the given abstract product SKU.'

        # No SKU-less fallback route here, unlike the sibling product sub-resources: it would be
        # `/abstract-products/product-tax-sets`, which the abstract-product item route matches
        # first — routes are registered in resource-class order, and AbstractProducts sorts before
        # ProductTaxSets. The URL still answers the same legacy 404, just from the other resource.

    properties:
        uuid:
            type: string
            identifier: true
            writable: false
            readable: true
            description: 'Tax set UUID'
            openapiContext:
                example: 'a1b2c3d4-0000-5000-a000-000000000001'

        name:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Tax set name'
            openapiContext:
                example: 'Electronics'

        restTaxRates:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Collection of applicable tax rates. Retained under the `restTaxRates` key for backward compatibility with the legacy REST API response (RestProductTaxSetsAttributesTransfer).'
            openapiContext:
                example:
                    - name: 'Germany Standard'
                      rate: '19.00'
                      country: 'DE'
